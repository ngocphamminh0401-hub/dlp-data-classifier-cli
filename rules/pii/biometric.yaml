# PII — Dữ liệu sinh trắc học (Biometric Data)
# NĐ 13/2023/NĐ-CP Điều 2, Khoản 4 — sinh trắc học là dữ liệu cá nhân NHẠY CẢM ĐẶC BIỆT.
# GDPR Article 9(1) — biometric data processed for unique identification = special category.
#
# Rò rỉ sinh trắc học KHÔNG THỂ KHẮC PHỤC — mật khẩu có thể đổi, vân tay không thể đổi.
# Đặc biệt nguy hiểm khi xuất hiện trong file: template vân tay, embedding khuôn mặt,
# dữ liệu mống mắt, giọng nói, chữ ký sinh trắc (behavioral).
# → Level: SECRET (L4)

id: biometric_001
name: "Dữ liệu sinh trắc học (vân tay, khuôn mặt, mống mắt)"
category: pii
level: SECRET
weight: 0.92
priority: 83
tags: [pii, biometric, fingerprint, face_id, sensitive_pii, ndctn13, pii_strong]
enabled: true

patterns:
  # Từ khóa sinh trắc học trực tiếp — CHỈ là nhắc đến chủ đề (vd: PR ngân
  # hàng "xác thực khuôn mặt bằng công nghệ AI" khi quảng cáo tính năng
  # eKYC), KHÔNG chứng minh có dữ liệu sinh trắc THẬT trong file. Theo tài
  # liệu "Bộ rule kết hợp Regex" (Phần 2 — flag BIOMETRIC_GENETIC): chỉ
  # keyword sinh trắc → CONFIDENTIAL, không tự động SECRET. Từng để SECRET +
  # context_required=false đã đôn nhầm 1 thông cáo báo chí PUBLIC lên
  # RESTRICTED (finance_banking__public/fin_pub_00008) — thực tế chỉ có
  # pattern #2 (template/embedding CÓ giá trị base64 thật) mới là bằng chứng
  # dữ liệu sinh trắc thật, giữ SECRET.
  - regex: '(?i)(?:fingerprint|vân\s*tay|dấu\s*vân\s*tay|face\s*id|face\s*recognition|nhận\s*dạng\s*khuôn\s*mặt|facial\s*recognition|sinh\s*trắc\s*học|biometric(?:\s*data)?|iris\s*scan|võng\s*mạc|retina|voice\s*print|nhận\s*dạng\s*giọng\s*nói)'
    description: "Từ khóa sinh trắc học trực tiếp (chỉ nhắc chủ đề)"
    confidence: 0.88
    context_required: false
    override_level: CONFIDENTIAL

  # Template / embedding sinh trắc (chuỗi base64/hex dài sau label sinh trắc)
  # — đây mới là bằng chứng CÓ dữ liệu sinh trắc thật, giữ nguyên SECRET.
  - regex: '(?i)(?:fingerprint|biometric|face)\s*(?:template|data|hash|embedding|vector|feature)\s*[:=]\s*[A-Za-z0-9+/=]{20,}'
    description: "Template / embedding dữ liệu sinh trắc học"
    confidence: 0.95
    context_required: false
    override_level: SECRET

  # Dữ liệu CCCD chip — chỉ nhắc chủ đề, tương tự pattern #1 → CONFIDENTIAL
  - regex: '(?i)(?:dữ\s*liệu\s*chip|chip\s*data|contactless\s*chip|NFC\s*data|thẻ\s*chip|ePassport\s*data|eMRTD)'
    description: "Dữ liệu chip CCCD / hộ chiếu điện tử (chứa sinh trắc)"
    confidence: 0.85
    context_required: false
    override_level: CONFIDENTIAL

  # FaceID / TouchID trong ngữ cảnh xác thực kỹ thuật số — chỉ nhắc chủ đề
  - regex: '(?i)(?:touchid|touch\s*id|faceid|face\s*id|windows\s*hello|liveness\s*detection|anti-spoofing|nhận\s*dạng\s*sinh\s*trắc)'
    description: "Xác thực sinh trắc kỹ thuật số (TouchID, FaceID, Windows Hello)"
    confidence: 0.82
    context_required: true
    override_level: CONFIDENTIAL

keywords:
  primary:
    - "sinh trắc học"
    - "biometric"
    - "vân tay"
    - "fingerprint"
    - "khuôn mặt"
    - "face recognition"
    - "nhận dạng khuôn mặt"
    - "mống mắt"
    - "iris"
    - "giọng nói"
    - "voice recognition"
    - "FaceID"
    - "TouchID"
    - "nhận dạng sinh trắc"
  secondary:
    - "xác thực"
    - "authentication"
    - "template"
    - "embedding"
    - "chip CCCD"
    - "ePassport"
    - "liveness"
    - "chống giả mạo"
    - "anti-spoofing"
    - "định danh sinh trắc"

false_positive_reduction:
  min_context_window: 150
  exclude_if_no_keywords: false

# Rule-attribution trên rawdata/ cho thấy pattern_1/3/4 (chỉ nhắc CHỦ ĐỀ sinh
# trắc, không kèm dữ liệu thật — khác pattern_2 template/embedding) là nguồn
# FP PUBLIC lớn thứ 3 (71 file): brochure/thông cáo báo chí ngân hàng mô tả
# TÍNH NĂNG eKYC ("tích hợp công nghệ nhận diện sinh trắc học", "PHÁT BIỂU
# LÃNH ĐẠO ... chia sẻ") — không phải hồ sơ có dữ liệu sinh trắc thật.
#
# ĐÃ THỬ required_corroboration_tags:[personal_identifier] TRƯỚC (như health_
# 001/income_001) NHƯNG BỊ LOẠI: kiểm chứng trực tiếp cho thấy 53/71 file FP
# VẪN có personal_identifier — không phải bằng chứng thật mà do chính 2 rule
# đó cũng FP trên cùng văn bản PR (dob_001 khớp NGÀY PHÁT HÀNH thông cáo báo
# chí thay vì ngày sinh; vn_name_001 khớp TÊN LÃNH ĐẠO được trích phát biểu,
# không phải khách hàng) — dùng làm gate sẽ không lọc được phần lớn case.
#
# Chuyển sang negation_filter theo NGỮ VỰNG MARKETING đặc trưng: đối chiếu
# trực tiếp cho thấy văn bản đăng ký sinh trắc THẬT dùng "hồ sơ đăng ký",
# "tỷ lệ khớp", "loại sinh trắc học thu thập" — khác hẳn brochure PR dùng
# "công nghệ"/"tính năng"/"trải nghiệm"/"phát biểu lãnh đạo". Xác nhận AN
# TOÀN: chỉ 5/679 match thật trên finance_banking__top_secret rơi vào 1
# trong các trigger (chủ yếu do trùng từ ngẫu nhiên: "Trung tâm Công nghệ
# Ngân hàng"/"Bộ phận Công nghệ Sinh học" là TÊN PHÒNG BAN, không phải ngữ
# cảnh marketing) — với ~6.5 match/file trung bình, các match còn lại trong
# cùng file vẫn đủ giữ đúng SECRET ở cấp file.
level_gate:
  require_corroboration: true
  fallback_level: INTERNAL
  applies_to_patterns: [pattern_1, pattern_3, pattern_4]

negation_filter:
  window_chars: 60
  trigger_words:
    - "công nghệ"
    - "tính năng"
    - "trải nghiệm người dùng"
    - "ra mắt"
    - "ký kết hợp tác"
    - "sản phẩm mới"
    - "ứng dụng ngân hàng"
    - "phát biểu"
    - "chia sẻ"
    - "lãnh đạo"
  action: downgrade_to_gate
  applies_to_patterns: [pattern_1, pattern_3, pattern_4]
