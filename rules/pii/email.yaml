# PII-004 — Địa chỉ Email
# RFC 5322 simplified. Email là PII theo GDPR và Nghị định 13/2023.
#
# Phân loại 2 cấp:
#   - Email thông thường → INTERNAL (kém nhạy cảm hơn)
#   - Email nội bộ VNPT → CONFIDENTIAL (override_level)
#   - Email có kèm họ tên rõ ràng → nâng qua compound rule

id: email_001
name: "Địa chỉ email"
category: pii
level: INTERNAL
weight: 0.75
priority: 45
tags: [pii, email, contact_info]
enabled: true

patterns:
  # Email nội bộ VNPT — phải match trước email thông thường (confidence cao hơn)
  # Các domain VNPT hiện tại và các đơn vị thành viên
  - regex: '[A-Za-z0-9._%+\-]+@(?:vnpt\.vn|vnpt-i\.vn|vnptit\.vn|vinaphone\.vn|vnpttechnology\.vn|vnpt\.com\.vn|vnpt-net\.vn|vnptmedia\.vn)'
    description: "Email nội bộ VNPT (tất cả domain VNPT)"
    confidence: 0.98
    context_required: false
    override_level: INTERNAL

  # Email tổ chức chính phủ VN (.gov.vn, .edu.vn)
  - regex: '[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.(?:gov\.vn|edu\.vn|mil\.vn)'
    description: "Email tổ chức nhà nước VN (.gov.vn / .edu.vn / .mil.vn)"
    confidence: 0.95
    context_required: false
    override_level: INTERNAL

  # Email chuẩn RFC 5322 (đơn giản hóa) — tất cả domain
  # Loại bỏ: no-reply@, noreply@, donotreply@, bounce@, mailer-daemon@
  - regex: '[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,7}'
    description: "Email chuẩn (mọi domain) — tổng quát"
    confidence: 0.70
    context_required: false

keywords:
  primary:
    - "email"
    - "địa chỉ email"
    - "hộp thư"
    - "thư điện tử"
    - "e-mail"
  secondary:
    - "liên hệ"
    - "liên lạc"
    - "contact"
    - "gửi mail"
    - "inbox"
    - "địa chỉ thư"

false_positive_reduction:
  min_context_window: 0
  # Email tự nhận dạng qua ký tự @ — context_required=false trên tất cả pattern
  # nên rule KHÔNG bị skip dù keywords: [] trước đây.
  # Keywords được thêm để cải thiện context boost score (0 → +0.15/+0.30).
  exclude_if_no_keywords: false

# Volume escalation: 1 email lẻ chỉ là INTERNAL, nhưng danh sách hàng loạt
# email trong cùng 1 file (leak database khách hàng) là rủi ro khác hẳn.
# Ngưỡng đầu (→CONFIDENTIAL) sửa 20→50 để khớp ngưỡng SCALE_LARGE >50 theo
# quyết định team (tài liệu "Bộ rule kết hợp Regex", mục 6.3) — email là 1
# dạng PII_DIRECT như CCCD/SĐT, cùng chung 1 ngưỡng quy mô lớn. Ngưỡng
# 200→SECRET giữ nguyên (tài liệu không định nghĩa ngưỡng SECRET riêng cho
# quy mô cực lớn — 200 là bậc "mất mát hàng loạt" hợp lý cao hơn hẳn 50).
volume_escalation:
  thresholds:
    - min_count: 50
      escalate_to: CONFIDENTIAL
    - min_count: 200
      escalate_to: SECRET
