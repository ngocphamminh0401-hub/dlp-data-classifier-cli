# PII-005 — Họ tên người Việt Nam
# Phát hiện dựa trên danh sách họ phổ biến nhất (top 35 họ VN, chiếm ~98% dân số).
# Pattern yêu cầu đúng cấu trúc: [Họ] [Tên đệm]* [Tên] (2-4 từ)
#
# Nguồn: Tổng điều tra dân số 2019 — Tổng cục Thống kê.
# Họ phổ biến nhất: Nguyễn (~40%), Trần (~12%), Lê (~10%), Phạm (~7%), ...
#
# FP risk: tên riêng nước ngoài có thể khớp pattern (vd: "Lê Pen" → Lê + 1 từ).
# Giảm thiểu: confidence thấp + bắt buộc keyword ngữ cảnh.
#
# Lưu ý kỹ thuật: Dùng \p{Lu}\p{L}+ cho Unicode Vietnamese (thay vì [A-ZÀÁÂ..]).
# RE2 của Go hỗ trợ \p{Lu} (uppercase letter) và \p{L} (any letter).

id: vn_name_001
name: "Họ tên người Việt Nam"
category: pii
level: INTERNAL
weight: 0.70
priority: 30
tags: [pii, personal_name, pii_name, vn_specific, personal_identifier]
enabled: true

patterns:
  # Họ tên đầy đủ: [Họ phổ biến] + [1-3 tên đệm/tên] viết hoa chữ đầu
  # \p{Lu} = uppercase Unicode letter, \p{L} = any Unicode letter
  # \p{L}* (không phải \p{L}+): CHO PHÉP token 1 ký tự — cần thiết để capture
  # ĐẦY ĐỦ tên placeholder kiểu "Nguyễn Văn A" (regex cũ dùng \p{L}+ khiến
  # chữ "A" đơn lẻ bị bỏ ngoài match, match dừng ở "Nguyễn Văn" — không đủ để
  # placeholder_exclusion bên dưới nhận diện và loại trừ). Token thật (2+
  # ký tự) vẫn khớp bình thường vì \p{L}* chấp nhận cả 0 lẫn nhiều ký tự.
  - regex: '(?:Nguyễn|Trần|Lê|Phạm|Hoàng|Huỳnh|Phan|Vũ|Võ|Đặng|Bùi|Đỗ|Hồ|Ngô|Dương|Lý|Đinh|Trịnh|Đoàn|Lưu|Vương|Cao|Mai|Tô|Châu|Hà|Tăng|Thái|Lâm|Đào|Quách|La|Kiều|Trương|Tiền|Linh|Văn|Thị|Ngọc|Tống|Lương|Mạc|Nghiêm|Thiều)\s+\p{Lu}\p{L}*(?:\s+\p{Lu}\p{L}*){1,3}'
    description: "Họ tên người Việt (họ phổ biến + tên đệm + tên)"
    confidence: 0.75
    context_required: true

  # Pattern đặc biệt: "Họ và tên: Nguyễn Văn A" — label rõ ràng
  # \p{L}* (thay \p{L}+): cùng lý do như pattern trên — capture đủ "A" cuối
  - regex: '(?i)(?:họ\s*(?:và\s*)?tên|tên\s*khách\s*hàng|full\s*name|tên\s*người\s*dùng|chủ\s*tài\s*khoản)\s*[:]\s*(?:Nguyễn|Trần|Lê|Phạm|Hoàng|Huỳnh|Phan|Vũ|Võ|Đặng|Bùi|Đỗ|Hồ|Ngô|Dương|Lý|Đinh|Trịnh|Đoàn)\s+\p{Lu}\p{L}*(?:\s+\p{Lu}\p{L}*)*'
    description: "Họ tên sau label rõ ràng (họ và tên:, tên KH:, ...)"
    confidence: 0.90
    context_required: false

keywords:
  primary:
    - "họ tên"
    - "họ và tên"
    - "tên khách hàng"
    - "full name"
    - "tên người dùng"
    - "tên nhân viên"
    - "chủ tài khoản"
    - "người đại diện"
    - "tên chủ thẻ"
    - "đại diện pháp luật"
    - "người ký"
    - "chủ sở hữu"
    - "last name"
    - "first name"
    - "tên đầy đủ"
    - "họ tên đầy đủ"
    # Cột lịch trực khoa/gác dùng chức danh thay "họ tên" (health_int_00660.
    # docx: "Bác sĩ trực"/"Điều dưỡng trực" thay vì "Họ tên bác sĩ trực" như
    # health_int_00645.docx) — cùng loại dữ liệu (tên thật, không ẩn danh)
    # nhưng thiếu keyword "họ tên" khiến context_required không thỏa dù danh
    # sách tên vẫn hiện diện đầy đủ trong bảng.
    - "bác sĩ trực"
    - "điều dưỡng trực"
  secondary:
    - "khách hàng"
    - "người dùng"
    - "nhân viên"
    - "hành khách"
    - "bệnh nhân"
    - "học sinh"
    - "sinh viên"
    - "ký tên"
    - "chữ ký"
    - "người lập"
    - "người phê duyệt"
    - "bên ký"
    - "giám đốc"
    - "trưởng phòng"

keyword_logic:
  min_primary: 1
  min_secondary: 0
  confidence_per_keyword: 0.08
  max_confidence: 0.92

false_positive_reduction:
  exclude_if_no_keywords: true
  min_context_window: 100

# Tên minh họa/placeholder trong văn bản mẫu VN (hợp đồng mẫu, template) theo
# quy ước "[Họ] [Chữ đệm] + 1 CHỮ CÁI ĐƠN viết hoa" (VD "Nguyễn Văn A", "Trần
# Thị B", "Lê Văn C"...) — tên người Việt thật KHÔNG BAO GIỜ chỉ có 1 ký tự
# (luôn ≥1 âm tiết đầy đủ), nên đây là tín hiệu placeholder rất đáng tin cậy,
# không cần liệt kê từng tổ hợp Họ+X cụ thể.
#
# value_blocklist_full_match=true: match của rule này là CẢ CỤM họ tên nhiều
# từ (không có label/delimiter rõ ràng ở pattern 1) — extractMatchValue mặc
# định tách theo khoảng trắng CUỐI sẽ chỉ lấy chữ cái cuối ("A"), không phải
# cả cụm. Kiểm tra trên TOÀN BỘ match (kể cả pattern 2 có label "Họ và tên:"
# — .+ trong regex vẫn hấp thụ được phần label, không ảnh hưởng kết quả).
#
# LƯU Ý: regex ở trên đã đổi \p{L}+ → \p{L}* cho token cuối để capture đủ
# "Nguyễn Văn A" (trước đây regex tự bỏ chữ "A" đơn lẻ ngoài match, khiến
# blocklist này không bao giờ khớp được — đã verify qua test trực tiếp).
placeholder_exclusion:
  value_blocklist_patterns:
    - '^.+\s\p{Lu}$'
  value_blocklist_full_match: true
