# PII-001 — Căn cước công dân (CCCD) / Chứng minh nhân dân (CMND)
# Nghị định 13/2023/NĐ-CP — danh mục dữ liệu cá nhân nhạy cảm
#
# CCCD 12 số: cấp từ 2012, hiện là định danh chính thức.
# CMND 9 số:  cấp trước 2012, vẫn còn lưu hành đến hết 2024.
#
# FP risk cao vì 9/12 chữ số xuất hiện phổ biến (mã đơn hàng, số serial...).
# Yêu cầu TỐI THIỂU 1 keyword ngữ cảnh để xác nhận.

id: vn_id_001
name: "Căn cước công dân / CMND Việt Nam"
category: pii
level: CONFIDENTIAL
weight: 0.90
priority: 80
tags: [pii, identity, pii_vn_id, vn_specific]
enabled: true

patterns:
  # CCCD 12 số — \b là zero-width, không consuming; tránh miss consecutive numbers
  - regex: '\b(\d{12})\b'
    description: "CCCD 12 chữ số (từ 2012) — word boundary"
    confidence: 0.85
    context_required: true
    validators: [vn_cccd_prefix]

  # CMND 9 số — confidence thấp hơn vì 9 số dễ bị nhầm hơn
  - regex: '\b(\d{9})\b'
    description: "CMND 9 chữ số (trước 2012)"
    confidence: 0.70
    context_required: true

  # CCCD trong MRZ (Machine Readable Zone) — thẻ CCCD chip
  - regex: 'VNM\d{12}[MF]'
    description: "CCCD trong MRZ của thẻ chip (quốc tịch VNM + 12 số + giới tính)"
    confidence: 0.97
    context_required: false

keywords:
  primary:
    - "căn cước"
    - "CMND"
    - "CCCD"
    - "chứng minh nhân dân"
    - "số định danh"
    - "số định danh cá nhân"
    - "giấy tờ tùy thân"
    - "số định danh quốc gia"
    - "căn cước công dân"
    - "chứng minh thư"
    - "số CCCD"
    - "CMND/CCCD"
    - "thẻ căn cước"
    - "VNeID"
    - "định danh điện tử"
  secondary:
    - "identity"
    - "ID number"
    - "national ID"
    - "cấp ngày"
    - "nơi cấp"
    - "ngày cấp"
    - "có giá trị đến"
    - "quê quán"
    - "hộ khẩu thường trú"
    - "nơi thường trú"
    - "mã định danh"
    - "căn cước gắn chip"
    - "eID"

false_positive_reduction:
  min_context_window: 200
  exclude_if_no_keywords: true

# Theo tài liệu "Bộ rule kết hợp Regex" (Bước 5): PII_DIRECT (CCCD) kết hợp
# FIN_ACCOUNT (tài khoản/ngân hàng) hay các trường PII cơ bản khác (ngày
# sinh/họ tên/địa chỉ) CHỈ dừng ở CONFIDENTIAL, không tự động SECRET — đây
# chính là hình dạng bình thường của MỌI form CMND/CCCD/hợp đồng/KYC, không
# phải bằng chứng bổ sung. checkEscalation() (internal/engine/regex.go) quét
# ±300 byte quanh match, escalate ngay khi thấy 1 keyword, KHÔNG gate/đếm số
# lần — đã gỡ "ngày sinh"/"họ và tên"/"địa chỉ"/"tài khoản"/"ngân hàng"/
# "thẻ tín dụng" khỏi danh sách vì đây chính là nguyên nhân khiến gần như
# MỌI file có CCCD (kể cả file CONFIDENTIAL bình thường) bị đẩy sai lên
# SECRET/RESTRICTED (xác nhận qua eval_confusion.go: CONFIDENTIAL-row chỉ
# đạt 3.3% accuracy, 1446/1600 file bị chấm RESTRICTED sai). Giữ lại
# "mật khẩu"/"password" (CCCD cạnh credential là AUTH_SECRET thật) và
# "sinh trắc học"/"biometric"/"vân tay" (tín hiệu bổ trợ vô hại, dù giờ dư
# thừa so với biometric.yaml's override_level:SECRET).
escalation:
  keywords:
    - "mật khẩu"
    - "password"
    - "sinh trắc học"
    - "biometric"
    - "vân tay"
  escalate_to: SECRET

# SCALE_LARGE theo tài liệu (Bước 3, quyết định team mục 6.3): >50 bản ghi
# CCCD duy nhất trong 1 file → RESTRICTED. Đây là xấp xỉ THEO TỪNG rule ID
# riêng lẻ (ApplyVolumeEscalation key theo rule.ID — internal/engine/
# classifier.go), KHÔNG PHẢI đếm gộp liên-category "PII_DIRECT" đúng nghĩa
# tài liệu (VD: 30 CCCD + 30 hộ chiếu cùng file = 60 bản ghi theo tài liệu
# nhưng không rule nào tự kích hoạt vì mỗi rule chỉ đếm riêng tới 30). Đếm
# gộp liên-rule cần sửa engine — ngoài phạm vi đợt này.
volume_escalation:
  thresholds:
    - min_count: 50
      escalate_to: SECRET
