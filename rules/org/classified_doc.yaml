# ORG-001 — Nhãn phân loại bảo mật tài liệu (Document Classification Labels)
# Theo Luật Bảo vệ Bí mật Nhà nước 2018 (Luật số 29/2018/QH14)
# và Nghị định 26/2020/NĐ-CP về phân loại tài liệu mật.
#
# TÁCH THÀNH 2 RULE ĐỂ MAP ĐÚNG LEVEL:
#   classified_doc_001  — SECRET   : TỐI MẬT, MẬT, RESTRICTED, TOP SECRET
#   classified_doc_002  — CONFIDENTIAL : CONFIDENTIAL, BÍ MẬT
#
# Lý do tách: rule cũ dùng override_level=SECRET cho tất cả nhãn kể cả
# "CONFIDENTIAL" → toàn bộ file L3 bị nâng nhầm lên RESTRICTED.

id: classified_doc_001
name: "ORG-001 Tài liệu TỐI MẬT / MẬT / RESTRICTED"
category: org
level: SECRET
weight: 0.95
priority: 95
tags: [org, classified_doc, restricted]
enabled: true

patterns:
  # TỐI MẬT / TOP SECRET xuất hiện độc lập — tín hiệu rất mạnh
  - regex: '(?i)\b(?:TỐI\s*MẬT|TOP\s*SECRET|CỰC\s*KỲ\s*BÍ\s*MẬT)\b'
    description: "ORG-001a nhãn tối mật / top secret"
    confidence: 0.97
    context_required: false
    override_level: SECRET

  # RESTRICTED / MẬT trong ngữ cảnh phân loại (gần marker "Phân loại:")
  - regex: '(?i)(?:phân\s*loại|classification|security\s*label|label)\s*[:=—\-]\s*(?:RESTRICTED|MẬT)\b'
    description: "ORG-001b RESTRICTED/MẬT sau nhãn phân loại"
    confidence: 0.96
    context_required: false
    override_level: SECRET

  # RESTRICTED standalone (word boundary) — confidence thấp hơn, cần context
  # Không match "MẬT" độc lập: từ này xuất hiện phổ biến trong "bảo mật", "mật khẩu",
  # "bí mật" → quá nhiều false positive. Chỉ match khi có tiền tố "Phân loại:" (pattern trên).
  - regex: '(?i)\bRESTRICTED\b'
    description: "ORG-001c RESTRICTED standalone"
    confidence: 0.82
    context_required: true
    override_level: SECRET

  # ĐÃ GỠ: pattern regex cho "bảo mật tuyệt đối". Xác minh trên dữ liệu thật
  # (finance_banking__public/fin_pub_00008) cho thấy đây là câu marketing rất
  # phổ biến trong PR ngân hàng ("...nhanh chóng, an toàn và bảo mật tuyệt
  # đối") — KHÔNG phải nhãn phân loại tài liệu, khiến 1 thông cáo báo chí
  # PUBLIC bị đôn lên RESTRICTED. Khác "tuyệt mật" (chỉ dùng trong ngữ cảnh
  # phân loại mật, hiếm gặp ngoài văn bản mật thật), "bảo mật tuyệt đối" là
  # cụm quảng cáo an toàn sản phẩm thông thường — giữ lại trong keywords để
  # boost confidence khi ĐÃ có match khác, không tự tạo match SECRET.

  # "tuyệt mật" — cụm 2 từ đặc trưng, khác "MẬT" đứng một mình (lý do rule
  # ORG-001c phải cần context: "MẬT" đơn lẻ xuất hiện quá phổ biến trong "bảo
  # mật", "mật khẩu", "bí mật"). "tuyệt mật" trước đây chỉ nằm trong keywords
  # (chỉ boost confidence, không tự tạo match) nên các hợp đồng/báo cáo nhắc
  # "tài liệu thuộc diện tuyệt mật" nhiều lần vẫn không kích hoạt được rule.
  - regex: '(?i)tuyệt\s*mật'
    description: "ORG-001e tuyệt mật"
    confidence: 0.90
    context_required: false
    override_level: SECRET

keywords:
  primary:
    - "TỐI MẬT"
    - "MẬT"
    - "TOP SECRET"
    - "RESTRICTED"
    - "tài liệu mật"
    - "bí mật nhà nước"
    - "tuyệt mật"
    - "cực mật"
    - "đóng dấu mật"
    - "strictly confidential"
    - "eyes only"
    - "need to know"
    - "highly sensitive"
    - "bảo mật tuyệt đối"
  secondary:
    - "không được sao chép"
    - "lưu hành hạn chế"
    - "security classification"
    - "phân loại tài liệu"
    - "nhạy cảm cao"
    - "hạn chế tối đa"
    - "kiểm soát đặc biệt"
    - "classification level"
    - "access control"

# Không có validator nào xác nhận "TỐI MẬT" là nhãn thật (chỉ là regex keyword).
# 1 lần nhắc đến cụm này (vd: tài liệu chính sách GIẢI THÍCH các cấp phân loại,
# không phải tài liệu MANG nhãn đó) không nên đủ để kết luận cả file SECRET.
# Cần thêm bằng chứng: validator, ≥2 lần xuất hiện, hoặc rule khác (vd: pii,
# financial) cùng có mặt ở mức CONFIDENTIAL+ — nếu không, hạ về CONFIDENTIAL.
level_gate:
  require_corroboration: true
  fallback_level: CONFIDENTIAL
