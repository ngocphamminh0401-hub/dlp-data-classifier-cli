# ORG-004 — Địa chỉ IP nội bộ (RFC 1918 private address space)
# Phát hiện IP nội bộ trong file cấu hình, log, source code, tài liệu kỹ thuật.
# Sự rò rỉ IP nội bộ giúp attacker lập bản đồ mạng nội bộ (network reconnaissance).
#
# RFC 1918 PRIVATE RANGES:
#   10.0.0.0/8        — Class A: 10.x.x.x
#   172.16.0.0/12     — Class B: 172.16.x.x đến 172.31.x.x
#   192.168.0.0/16    — Class C: 192.168.x.x (phổ biến nhất)
#
# RFC 5735 SPECIAL RANGES:
#   169.254.0.0/16    — Link-local (APIPA)
#   127.0.0.0/8       — Loopback (ít nguy hiểm hơn)
#
# Không phải mọi IP nội bộ đều nhạy cảm — context quyết định cấp độ.
# IP + username/password → SECRET; IP đơn lẻ → INTERNAL.

id: internal_ip_001
name: "ORG-004 Địa chỉ IP nội bộ (Private)"
category: org
level: INTERNAL
weight: 0.75
priority: 50
tags: [org, internal_ip, network, infrastructure, rfc1918]
enabled: true

patterns:
  - regex: '\b(?:10\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]\d|\d)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]\d|\d)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]\d|\d)|172\.(?:1[6-9]|2\d|3[01])\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]\d|\d)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]\d|\d)|192\.168\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]\d|\d)\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]\d|\d))\b'
    description: "ORG-004 theo spec PDF"
    confidence: 0.88
    context_required: false

keywords:
  primary:
    - "địa chỉ IP"
    - "IP address"
    - "gateway"
    - "subnet"
    - "server"
    - "firewall"
    - "router"
  secondary:
    - "mạng nội bộ"
    - "internal network"
    - "LAN"
    - "WAN"
    - "VPN"
    - "DNS"
    - "DHCP"
    - "host"
    - "endpoint"
    - "network diagram"
    - "sơ đồ mạng"
    - "topology"
    - "database"
    - "server IP"

false_positive_reduction:
  min_context_window: 100
  exclude_if_no_keywords: false
  # IP nội bộ tự nhận dạng qua range — không cần keyword bắt buộc

escalation:
  keywords:
    - "password"
    - "passwd"
    - "mật khẩu"
    - "credentials"
    - "username"
    - "login"
    - "admin"
    - "root"
    - "ssh"
    - "rdp"
    - "telnet"
  escalate_to: CONFIDENTIAL

# IP nội bộ (192.168.x.x, 10.x.x.x...) là ví dụ minh họa cực phổ biến trong
# tài liệu hướng dẫn kỹ thuật công khai, giáo trình mạng máy tính, blog kỹ
# thuật — không phải lúc nào cũng phản ánh hạ tầng thật của tổ chức.
# keywords.secondary (database, server, host) quá phổ biến trong bất kỳ tài
# liệu kỹ thuật nào để tự nó là bằng chứng đủ mạnh.
#
# min_confidence_bypass=0.90: PHÒNG regression đã gặp với watermark_001 (xem
# rules/org/watermark.yaml) — 1 IP thật kèm ngữ cảnh mạnh (VD "Server
# database production: 10.20.30.40, firewall..." → conf 0.96 nhờ boost từ
# nhiều keyword gần) vẫn là match đơn lẻ, không lặp lại, không có rule khác
# hỗ trợ → nếu không có bypass sẽ bị hạ PUBLIC sai dù rõ ràng là hạ tầng
# thật. Xác nhận qua test trực tiếp trước khi thêm field này. Không xung đột
# với negation_filter bên dưới: match bị negation ép xuống fallback đã nằm ở
# mức sàn, applyLevelGate (dùng MinConfidenceBypass) chỉ HẠ chứ không nâng
# nên không "cứu" nhầm match đã bị negation loại.
level_gate:
  require_corroboration: true
  fallback_level: PUBLIC
  min_confidence_bypass: 0.90

# Nếu chunk có ngữ cảnh "ví dụ/minh họa" gần IP → đây là tài liệu hướng dẫn,
# không phải cấu hình hạ tầng thật → hạ ngay về fallback_level (PUBLIC) của
# level_gate, bất kể corroboration khác.
negation_filter:
  window_chars: 60
  trigger_words:
    - "ví dụ"
    - "example"
    - "vd:"
    - "sample"
    - "demo"
    - "hướng dẫn cấu hình mẫu"
  action: downgrade_to_gate
