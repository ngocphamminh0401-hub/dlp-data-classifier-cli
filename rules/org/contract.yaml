# ORG-003 + Org Contract — Tài liệu hợp đồng / thỏa thuận bảo mật + Mã hợp đồng/PO
# Kết hợp 2 loại phát hiện trong 1 rule:
#   1. Keyword-based: nhận dạng tài liệu hợp đồng qua từ khóa
#   2. Pattern-based: nhận dạng mã số hợp đồng / Purchase Order (ORG-003)

id: contract_001
name: "ORG-003 Mã số hợp đồng / PO"
category: org
level: CONFIDENTIAL
weight: 0.78
priority: 60
tags: [org, contract, nda, agreement, purchase_order]
enabled: true

patterns:
  - regex: '(?i)\b(?:HĐ|HD|PO|CONTRACT|CTR)[/\-]?\s*\d{4,12}(?:[/\-][A-Z0-9]+)*\b'
    description: "ORG-003 theo spec PDF"
    confidence: 0.90
    context_required: false

keywords:
  # Chỉ giữ trong primary các cụm ĐẶC TRƯNG hợp đồng thật (2+ từ, gắn với
  # định dạng tài liệu hợp đồng cụ thể) — bỏ "hợp đồng"/"contract"/"agreement"/
  # "thỏa thuận" đứng trần vì đây là từ QUÁ PHỔ BIẾN (mã đơn hàng thương mại
  # điện tử, email marketing "PO-123456"... đều dễ có các từ này lân cận mà
  # không phải hợp đồng thật). LƯU Ý: primary/secondary chỉ ảnh hưởng ĐỘ LỚN
  # context boost (Zone Primary > Secondary trong distanceWeightedBoost),
  # KHÔNG có tác dụng "bắt buộc" gì (keyword_logic.min_primary là dead field
  # — engine chỉ đọc min_secondary, xem comment ở business_internal.yaml) —
  # rào chắn thật cho pattern chung chung này nằm ở level_gate bên dưới.
  primary:
    - "hợp đồng số"
    - "số hợp đồng"
    - "contract no"
    - "mã hợp đồng"
    - "NDA"
    - "non-disclosure"
    - "thoả thuận bảo mật"
    - "hợp đồng dịch vụ"
    - "hợp đồng mua bán"
  secondary:
    - "hợp đồng"
    - "contract"
    - "agreement"
    - "thỏa thuận"
    - "bảo mật"
    - "confidential"
    - "cam kết"
    - "điều khoản"
    - "terms"
    - "conditions"
    - "phụ lục"
    - "annex"
    - "appendix"
    - "hiệu lực"
    - "effective date"
    - "chấm dứt"
    - "termination"
    - "vi phạm"
    - "breach"
    - "bồi thường"
    - "penalty"
    - "nghĩa vụ"
    - "obligation"
    - "quyền và nghĩa vụ"
    - "purchase order"
    - "đơn đặt hàng"
    - "báo giá"
    - "quotation"

# keyword_logic (min_primary/confidence_per_keyword/max_confidence): ĐÃ XÓA
# — dead field, chưa từng được engine đọc (xem internal/engine/rules.go
# KeywordLogic). min_secondary vốn = 0 (không active, MinSecondary>0 mới
# gate) nên xóa cả block không đổi hành vi.

# Trước đây pattern KHÔNG yêu cầu keyword nào (context_required=false, không
# có false_positive_reduction) — mã "PO-123456"/"HD-2024001" tự nó đủ để
# match, kể cả trong mã đơn hàng thương mại điện tử/email marketing hoàn
# toàn không liên quan hợp đồng. exclude_if_no_keywords bắt buộc phải có ÍT
# NHẤT 1 keyword (primary hoặc secondary) ở ĐÂU ĐÓ trong chunk.
false_positive_reduction:
  min_context_window: 100
  exclude_if_no_keywords: true

# Mã hợp đồng/PO là định dạng CHUNG (dễ trùng số hóa đơn, mã đơn hàng công
# khai) — 1 lần khớp đơn lẻ, không lặp lại, không có rule khác hỗ trợ không
# nên tự động CONFIDENTIAL.
level_gate:
  require_corroboration: true
  fallback_level: INTERNAL

escalation:
  keywords:
    - "quốc phòng"
    - "an ninh quốc gia"
    - "tối mật"
    - "tài liệu mật"
    - "bí mật nhà nước"
  escalate_to: SECRET
