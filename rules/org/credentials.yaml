# ORG-005 — Thông tin xác thực / Credentials (passwords, API keys, tokens)
# Vi phạm nghiêm trọng nhất trong data leak — một mình credential đủ để xâm nhập hệ thống.
# Áp dụng cho: source code, file .env, config, log, tài liệu kỹ thuật.
#
# NGUYÊN TẮC PHÁT HIỆN:
#   1. Label-first: chỉ match khi có label rõ ràng (password=, api_key=, ...)
#   2. Giá trị phải đủ dài (≥ 8 ký tự) để loại trừ placeholder
#   3. Loại trừ giá trị placeholder phổ biến: "changeme", "your_password", "***", "..."
#
# Lưu ý: Không match token/key trong comment (vd: # password = xxx trong code review).
# Engine nên xem xét context line để phân biệt assignment vs comment.

id: credentials_001
name: "ORG-005 Thông tin kết nối DB / credentials"
category: org
level: SECRET
weight: 0.95
priority: 97
tags: [org, credentials, password, api_key, token, secret, security_critical]
enabled: true

patterns:
  # ENV/YAML format: PASSWORD=value, api_key: value
  - regex: '(?i)(?:password|passwd|pwd|secret|api[_\-]?key|token|connection[_\-]?string|db[_\-]?pass)\s*[:=]\s*["'']?[^\s"'']{6,}["'']?'
    description: "ORG-005 ENV/YAML format (key=value)"
    confidence: 0.92
    context_required: false

  # JSON format: "secret": "value", "JWT Secret": "abc123"
  - regex: '(?i)"(?:password|passwd|secret|api[\s_\-]?key|token|access[\s_\-]?key|jwt[\s_\-]?secret|aws[\s_\-]?secret|aws[\s_\-]?access[\s_\-]?key|database[\s_\-]?url|db[\s_\-]?pass|client[\s_\-]?secret|private[\s_\-]?key|refresh[\s_\-]?token|firebase|stripe|openai)"\s*:\s*"[A-Za-z0-9+/=_\-.@:!]{8,}"'
    description: "ORG-005 JSON format (\"key\": \"value\")"
    confidence: 0.90
    context_required: false

  # AWS Access Key ID — tiền tố AKIA/ASIA/AROA cố định (IAM format)
  - regex: '\b(?:AKIA|ASIA|AROA|AIDA)[A-Z0-9]{16}\b'
    description: "AWS Access Key ID (AKIA/ASIA/AROA prefix)"
    confidence: 0.97
    context_required: false

  # Stripe live/test secret key
  - regex: '\bsk_(?:live|test)_[A-Za-z0-9]{24,}\b'
    description: "Stripe secret key (sk_live_ / sk_test_)"
    confidence: 0.97
    context_required: false

  # Firebase API key (AIza prefix, 39 chars total)
  - regex: '\bAIza[A-Za-z0-9_\-]{35}\b'
    description: "Firebase/Google API key (AIza prefix)"
    confidence: 0.95
    context_required: false

  # OpenAI API key (sk- prefix, 40+ chars)
  - regex: '\bsk-[A-Za-z0-9]{20,}\b'
    description: "OpenAI / generic sk- API key"
    confidence: 0.88
    context_required: true

keywords:
  primary:
    - "password"
    - "passwd"
    - "secret"
    - "api_key"
    - "access_token"
    - "private_key"
    - "mật khẩu"
    - "credentials"
    - "authentication"
    - "client_secret"
    - "refresh_token"
    - "bearer"
    - "oauth"
    - "aws_access_key"
    - "AKID"
    - "AKIA"
    - "service_account_key"
    - "private_key_id"
    - "CLIENT_SECRET"
    - "REFRESH_TOKEN"
    - "AWS_SECRET"
    - "AWS_ACCESS_KEY_ID"
  secondary:
    - "token"
    - "api"
    - "key"
    - "auth"
    - ".env"
    - "config"
    - "connection string"
    - "database"
    - "login"
    - "xác thực"
    - "đăng nhập"
