# ORG-006 — Watermark nội bộ / Nhãn lưu hành hạn chế
# Phát hiện nhãn watermark văn bản chỉ ra tài liệu chỉ dùng nội bộ.
# Thường xuất hiện ở: header/footer văn bản, background watermark PDF,
# tiêu đề slide PowerPoint, ghi chú trong email.
#
# Strategy: Pattern match toàn cụm từ (multi-word), không match từng từ riêng lẻ.
# Vd: "nội bộ" riêng lẻ quá chung chung → "chỉ lưu hành nội bộ" mới đặc trưng.

id: watermark_001
name: "Watermark nội bộ / nhãn lưu hành hạn chế"
category: org
level: INTERNAL
weight: 0.80
priority: 45
tags: [org, watermark, internal_label, distribution_control]
enabled: true

patterns:
  # Cụm từ chỉ lưu hành nội bộ đầy đủ — tín hiệu rất mạnh
  - regex: '(?i)(?:chỉ\s*lưu\s*hành\s*nội\s*bộ|internal\s*use\s*only|do\s*not\s*distribute|for\s*internal\s*use\s*only)'
    description: "ORG-006a nhãn lưu hành nội bộ đầy đủ"
    confidence: 0.93
    context_required: false

  # "Lưu hành nội bộ" KHÔNG có "chỉ" đứng trước — thực tế văn bản hay ghi
  # "(Lưu hành nội bộ - Chưa công bố)" ngay dưới tiêu đề mà không có "chỉ".
  # Trước đây bị bỏ sót hoàn toàn (chỉ ORG-006a match, yêu cầu đúng "chỉ lưu
  # hành nội bộ") khiến nhiều báo cáo tự khai báo rõ ràng vẫn bị chấm PUBLIC.
  - regex: '(?i)lưu\s*hành\s*nội\s*bộ'
    description: "ORG-006a2 lưu hành nội bộ (không bắt buộc có 'chỉ')"
    confidence: 0.90
    context_required: false

  # "Chưa công bố" đi kèm nội bộ — nhãn tự khai báo tài liệu chưa công khai
  - regex: '(?i)chưa\s*công\s*bố'
    description: "ORG-006g chưa công bố"
    confidence: 0.75
    context_required: true

  # Nhãn "Phân loại: INTERNAL" hoặc "Phân loại: NỘI BỘ" — rất đặc trưng
  - regex: '(?i)(?:phân\s*loại|classification|label)\s*[:=—\-]\s*(?:INTERNAL|NỘI\s*BỘ)\b'
    description: "ORG-006b INTERNAL/NỘI BỘ sau nhãn phân loại"
    confidence: 0.95
    context_required: false

  # NỘI BỘ kết hợp với hạn chế phổ biến — các biến thể thực tế trong dataset
  - regex: '(?i)NỘI\s*BỘ\s*[-—–]\s*(?:Không\s*phổ\s*biến|hạn\s*chế\s*phổ\s*biến|hạn\s*chế\s*lưu\s*hành|hạn\s*chế\s*phát\s*hành)'
    description: "ORG-006c NỘI BỘ + hạn chế phổ biến"
    confidence: 0.92
    context_required: false

  # INTERNAL kết hợp với hạn chế — vd: "INTERNAL — Hạn chế phổ biến"
  - regex: '(?i)INTERNAL\s*[-—–]\s*(?:Hạn\s*chế|Không\s*phổ\s*biến|restricted|limited)'
    description: "ORG-006d INTERNAL + hạn chế"
    confidence: 0.92
    context_required: false

  # Không/nghiêm cấm phổ biến/phát hành/chia sẻ/công bố ra ngoài — MỞ RỘNG
  # thêm "chia sẻ"/"công bố", cho phép "bên ngoài" (không chỉ "ngoài" trơn),
  # và thêm "nghiêm cấm" làm từ phủ định thay thế: xác nhận qua ins_int_00152
  # .docx ("không chia sẻ ra bên ngoài") và health_int_00006.docx
  # (healthcare__internal — "Dữ liệu chỉ phục vụ mục đích nội bộ, nghiêm cấm
  # chia sẻ ra ngoài phạm vi bệnh viện") rằng ghi chú tự khai phổ biến có
  # nhiều biến thể từ phủ định ("không" hoặc "nghiêm cấm") mà bản gốc chỉ
  # chấp nhận "không" nên bỏ sót "nghiêm cấm".
  - regex: '(?i)(?:không|nghiêm\s*cấm)\s*(?:phổ\s*biến|phát\s*hành|chia\s*sẻ|công\s*bố)\s*ra\s*(?:ngoài|bên\s*ngoài)'
    description: "ORG-006e không/nghiêm cấm phổ biến/phát hành/chia sẻ/công bố ra ngoài"
    confidence: 0.88
    context_required: false

  # INTERNAL standalone với word boundary — confidence thấp, cần context
  - regex: '(?i)\bINTERNAL\b'
    description: "ORG-006f INTERNAL standalone"
    confidence: 0.72
    context_required: true

keywords:
  primary:
    - "nội bộ"
    - "internal"
    - "lưu hành nội bộ"
    - "internal use only"
    - "chỉ lưu hành nội bộ"
    - "không phổ biến"
    - "không phổ biến ra ngoài"
    - "không chia sẻ ra bên ngoài"
    - "do not distribute"
    - "hạn chế phổ biến"
    - "hạn chế lưu hành"
    - "chưa công bố"
  secondary:
    - "bảo mật"
    - "hạn chế"
    - "phát hành"
    - "circulation"
    - "VNPT"
    - "tài liệu"
    - "phân loại"
