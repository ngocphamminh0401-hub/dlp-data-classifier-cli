# NGƯỠNG CONFIDENCE — phát hiện quan trọng khi debug HR-030q không khớp dù
# regex đúng (test độc lập bằng Go regexp pass, nhưng engine không trả về
# match): điểm cuối cùng = pattern.confidence × rule.weight (0.75 ở đây),
# rồi cộng thêm "distance-weighted context boost" từ keyword lân cận, sau
# đó so với engine.MinConfidence mặc định = 0.60 (internal/engine/
# classifier.go). Pattern confidence 0.65 → base 0.65×0.75=0.4875, THẤP HƠN
# ngưỡng 0.60 — nếu văn bản không đủ keyword lân cận để boost bù đắp
# (~+0.12 trở lên), match bị loại NGAY TỪ BƯỚC LỌC CONFIDENCE, không bao
# giờ xuất hiện trong kết quả (không phải lỗi regex hay lỗi context_required
# — dễ nhầm lẫn khi debug). Với rule.weight=0.75 của rule này, pattern cần
# confidence ≥ 0.80 mới CHẮC CHẮN vượt ngưỡng 0.60 kể cả KHÔNG có boost —
# đây là lý do các pattern HR-030m/q/r được nâng lên 0.82. Các pattern
# "bổ trợ yếu" cố ý (HR-030k/l, confidence 0.55-0.60, context_required:true)
# CHẤP NHẬN rủi ro hiếm khi tự vượt ngưỡng — vai trò của chúng chỉ là góp
# thêm 1 khả năng corroborate khi văn bản đủ giàu ngữ cảnh, không phải tín
# hiệu chính.
