# FIN-011 — Danh sách khách hàng VIP/ưu tiên (luôn RESTRICTED bất kể quy mô)
# Phát hiện qua thực tế: dataset đánh giá cho thấy danh sách khách hàng
# VIP/ưu tiên (kèm phân hạng tài sản: Kim cương/Bạch kim/VIP1/VIP2...) được
# coi là RESTRICTED ngay cả khi CHỈ có 10-15 khách hàng — thấp hơn nhiều so
# với ngưỡng SCALE_LARGE >50 chung (rules/pii/vn_id.yaml). Lý do: đây là
# nhóm khách hàng có giá trị tài sản cao được nhận diện đích danh + phân
# hạng cụ thể, rủi ro lộ lọt (nhắm mục tiêu tội phạm tài chính/bắt cóc/lừa
# đảo) không phụ thuộc số lượng bản ghi như PII đại trà thông thường.
#
# Không dùng volume_escalation (đếm số lần) vì bản chất rủi ro nằm ở NGỮ
# CẢNH "đây là danh sách khách VIP", không phải số lượng — 1 dòng "Danh sách
# khách hàng VIP" + 1 khách hàng vẫn đủ nguy hiểm như 15 khách hàng.

id: vip_customer_001
name: "FIN-011 Danh sách khách hàng VIP/ưu tiên"
category: financial
level: SECRET
weight: 0.90
priority: 90
tags: [financial, vip_customer, high_net_worth]
enabled: true

patterns:
  # Tiêu đề danh sách/báo cáo khách hàng VIP/ưu tiên
  - regex: '(?i)danh\s*sách\s*khách\s*hàng\s*(?:VIP|ưu\s*tiên)'
    description: "FIN-011a Tiêu đề danh sách khách hàng VIP/ưu tiên"
    confidence: 0.90
    context_required: false

  # Phân hạng khách hàng theo tài sản — cột "Hạng khách hàng" trong bảng
  - regex: '(?i)(?:hạng\s*khách\s*hàng|phân\s*hạng)\s*[:=]?\s*(?:VIP\d?|kim\s*cương|bạch\s*kim)'
    description: "FIN-011b Phân hạng khách hàng VIP (Kim cương/Bạch kim/VIP1/VIP2)"
    confidence: 0.85
    context_required: false

keywords:
  primary:
    - "khách hàng VIP"
    - "khách hàng ưu tiên"
    - "danh sách khách hàng VIP"
    - "phòng khách hàng ưu tiên"
  secondary:
    - "Kim cương"
    - "Bạch kim"
    - "VIP1"
    - "VIP2"
    - "AUM"
    - "tổng tài sản quản lý"
    - "hạng khách hàng"

# Cần corroboration: tránh 1 lần nhắc "khách hàng VIP" trong email marketing
# chung ("Ưu đãi đặc biệt cho khách hàng VIP") tự động thành RESTRICTED.
# Danh sách VIP thật luôn đi kèm dữ liệu tài chính/PII cụ thể (bank_account,
# vn_name...) đạt CONFIDENTIAL+ trong cùng chunk → đủ corroboration.
level_gate:
  require_corroboration: true
  fallback_level: CONFIDENTIAL

false_positive_reduction:
  min_context_window: 100
  exclude_if_no_keywords: false
